<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta regresiva · Lynette & Eduardo</title>
<style>
  /* ── Cambia aquí ──
     --fondo: "transparent" para ponerla sobre tu foto en Canva,
              o un color, por ejemplo #93253F
     --texto: #FFF4F6 (claro) o #93253F (vino)                    */
  :root{ --fondo: transparent; --texto: #FFF4F6; }

  @font-face{font-family:'Hanoman';src:url('https://casa-solstice-tracker-3hrf.vercel.app/fonts/le/hanoman-thin.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Cormorant';src:url('https://casa-solstice-tracker-3hrf.vercel.app/fonts/le/cormorant-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Cormorant';src:url('https://casa-solstice-tracker-3hrf.vercel.app/fonts/le/cormorant-500-italic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap}

  html,body{margin:0;height:100%;background:var(--fondo)}
  body{display:flex;align-items:center;justify-content:center;color:var(--texto);
       font-family:'Cormorant','Cormorant Garamond',Georgia,serif;text-align:center;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;padding:4vh 3vw;box-sizing:border-box}
  h2{margin:0 0 4vh;font-weight:500;font-style:italic;font-size:clamp(20px,4.2vw,68px);line-height:1.1}
  .grid{display:grid;grid-template-columns:repeat(4,1fr)}
  .num{display:block;font-family:'Hanoman',Georgia,serif;font-weight:400;font-size:clamp(38px,14vw,240px);line-height:.95;font-variant-numeric:tabular-nums}
  .lbl{display:block;font-size:clamp(13px,3vw,52px);line-height:1}
</style>
</head>
<body>
  <div class="wrap">
    <h2 id="titulo">Cada vez falta menos…</h2>
    <div class="grid" role="timer">
      <div><span class="num" id="d">--</span><span class="lbl">Días</span></div>
      <div><span class="num" id="h">--</span><span class="lbl">Horas</span></div>
      <div><span class="num" id="m">--</span><span class="lbl">Minutos</span></div>
      <div><span class="num" id="s">--</span><span class="lbl">Segundos</span></div>
    </div>
  </div>
<script>
  // Sábado 20 de marzo de 2027, 6:00 PM hora de Santo Domingo (UTC-4)
  var boda = new Date("2027-03-20T18:00:00-04:00").getTime();
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function tick(){
    var t = Math.max(0, boda - Date.now()), s = Math.floor(t / 1000);
    document.getElementById("d").textContent = Math.floor(s / 86400);
    document.getElementById("h").textContent = pad(Math.floor(s / 3600) % 24);
    document.getElementById("m").textContent = pad(Math.floor(s / 60) % 60);
    document.getElementById("s").textContent = pad(s % 60);
    if (t === 0) document.getElementById("titulo").textContent = "¡Llegó el día!";
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
